
name: Build HorizenEconomy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        working-directory: HorizenEconomy
        run: mvn -B clean verify

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HorizenEconomy
          path: HorizenEconomy/target/HorizenEconomy-1.0.0.jar
          if-no-files-found: error
